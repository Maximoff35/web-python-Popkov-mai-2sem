{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">{% endblock %}

{% block content %}
<section class="panel form-panel">
    <h1>Регистрация</h1>
    <form method="post" class="form-grid">
        <label>
            <span>Username</span>
            <input type="text" name="username" value="{{ form_data.username }}" required>
        </label>
        <label>
            <span>Email</span>
            <input type="email" name="email" value="{{ form_data.email }}" required>
        </label>
        <label>
            <span>Пароль</span>
            <input type="password" name="password" required>
        </label>
        <label>
            <span>Подтверждение пароля</span>
            <input type="password" name="password_confirm" required>
        </label>
        <button type="submit">Зарегистрироваться</button>
    </form>
</section>
{% endblock %}
