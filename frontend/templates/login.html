{% extends "base.html" %}

{% block title %}Вход{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">{% endblock %}

{% block content %}
<section class="panel form-panel">
    <h1>Вход</h1>
    <form method="post" class="form-grid compact">
        <label>
            <span>Username</span>
            <input type="text" name="username" value="{{ form_data.username }}" required>
        </label>
        <label>
            <span>Пароль</span>
            <input type="password" name="password" required>
        </label>
        <button type="submit">Войти</button>
    </form>
</section>
{% endblock %}
